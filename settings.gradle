pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}
rootProject.name = 'warada_v2'
include 'application', 'commons', 'configurations', 'db-entities', 'repositories', 'services', 'resources'
