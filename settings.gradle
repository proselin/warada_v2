pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}
rootProject.name = 'warada_v2'

include 'shared-lib'
project(':shared-lib').projectDir = file('libs/shared-lib')

include 'crawl-service'
project(':crawl-service').projectDir = file('apps/crawl-service')

include 'core-service'
project(':core-service').projectDir = file('apps/core-service')

include 'display-service'
project(':display-service').projectDir = file('apps/display-service')