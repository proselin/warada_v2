configs:
  otel-collector-config:
    name: otel-collector-config
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      
      processors:
        batch:
      
        # Attach service name (if app doesn't send it, you can override here)
        resource:
          attributes:
            - key: service.name
              action: upsert
              value: warada
      
      exporters:
        # Prometheus exporter for metrics
        #prometheus:
        #  endpoint: "[::]:8889"
        #debug:
        #  verbosity: detailed
        #  sampling_initial: 5
        #  sampling_thereafter: 200
      
      extensions:
        health_check:
          endpoint: "[::]:13133"
        zpages:
          endpoint: "[::]:55679"
        pprof:
          endpoint: "[::]:1888"
      
      
      
      service:
        extensions: [ health_check, zpages, pprof ]
        pipelines:
          traces:
            receivers: [ otlp ]
            processors: [ batch ]
            exporters: [ debug ]
          metrics:
            receivers: [ otlp ]
            processors: [ batch ]
            exporters: [ debug ]
          logs:
            receivers: [ otlp ]
            processors: [ batch ]
            exporters: [ debug ]
      


services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USERNAME=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./temp/db-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-01-18T00-31-37Z
    command: >
      minio server /data
      --address ":9000"
      --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_USERNAME:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-admin123123123123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./temp/minio-data:/data

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - ./temp/rabbitmq-data:/var/lib/rabbitmq

