services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - maven-cache:/home/vscode/.m2
      - ${CONTAINER_SOCKET:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock
    environment:
      DEV_DB_URL: jdbc:postgresql://postgres:5432/postgres
      DEV_DB_USERNAME: postgres
      DEV_DB_PASSWORD: postgres
      DEV_RABBITMQ_HOST: rabbitmq
      DEV_RABBITMQ_PORT: 5672
      DEV_RABBITMQ_USERNAME: guest
      DEV_RABBITMQ_PASSWORD: guest
      DEV_S3_HOST: garage
      DEV_S3_PORT: 3900
      DEV_S3_ACCESS_KEY: warada-dev
      DEV_S3_SECRET_KEY: a1251ed99e3e8e221af619fdbafb77cd
      DEV_S3_SECURE: "false"
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_API_VERSION: "1.44"
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${DEBUG_PORT:-5005}:5005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      garage:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${DEV_DB_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "${DEV_RABBITMQ_EXPOSE_PORT:-5672}:5672"
      - "${DEV_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  garage:
    image: ${GARAGE_IMAGE:-docker.io/dxflrs/garage:v2.3.0}
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: warada-dev
      GARAGE_DEFAULT_SECRET_KEY: a1251ed99e3e8e221af619fdbafb77cd
      GARAGE_DEFAULT_BUCKET: warada-images
    ports:
      - "${DEV_GARAGE_S3_PORT:-3900}:3900"
      - "${DEV_GARAGE_RPC_PORT:-3901}:3901"
      - "${DEV_GARAGE_WEB_PORT:-3902}:3902"
      - "${DEV_GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ../garage.toml:/etc/garage.toml:ro

volumes:
  maven-cache:
  postgres-data:
  rabbitmq-data:
  garage-meta:
  garage-data:
