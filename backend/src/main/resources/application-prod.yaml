quarkus:
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${DB_URL}

  smallrye-graphql:
    ui:
      enabled: false
      always-include: false
    log-payload: off

  otel:
    enabled: true
    exporter:
      otlp:
        endpoint: ${OTLP_ENDPOINT}

  minio:
    host: ${S3_ENDPOINT}
    port: ${S3_PORT:3900}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    secure: ${S3_SECURE:true}
    # Must match the Garage server's [s3_api].s3_region.
    region: ${S3_REGION:garage}

  devservices:
    enabled: false

  native:
    enabled: true
    container-build: true
    builder-image: quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-25

  package:
    jar:
      enabled: false

warada:
  nettruyen:
    url: https://nettruyenar.com

  image-bucket: warada-images
  image-bucket-temp-path: temp
  image-bucket-images-path: images

  clean-up:
    enabled: true
    min-age-minutes: 5