quarkus:
  datasource:
    db-kind: postgresql
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:postgres}
    jdbc:
      url: ${DEV_DB_URL:jdbc:postgresql://localhost:5432/postgres}

  hibernate-orm:
    log:
      sql: false

  otel:
    enabled: false

  minio:
    host: ${DEV_S3_HOST:localhost}
    port: ${DEV_S3_PORT:3900}
    access-key: ${DEV_S3_ACCESS_KEY:warada-dev}
    secret-key: ${DEV_S3_SECRET_KEY:a1251ed99e3e8e221af619fdbafb77cd}
    secure: ${DEV_S3_SECURE:false}
    # Must match garage.toml's [s3_api].s3_region, otherwise Garage rejects
    # requests with "AuthorizationHeaderMalformed... unexpected scope".
    region: ${DEV_S3_REGION:garage}

  package:
    jar:
      enabled: true

# Podman is the default local container runtime. Disable Dev Services when no runtime is available.
  devservices:
    enabled: false

  docker:
    executable-name: podman

  native:
    container-runtime: podman

  observability:
    lgtm:
      enabled: false

warada:
  nettruyen:
    url: https://nettruyenar.com

  image-bucket: warada-images
  image-bucket-temp-path: temp
  image-bucket-images-path: images

  clean-up:
    enabled: true
    min-age-minutes: 5