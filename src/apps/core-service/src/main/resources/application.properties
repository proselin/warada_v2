quarkus.application.name=warada-core
quarkus.http.port=8082
quarkus.http.host=0.0.0.0

quarkus.log.console.darken = 1

quarkus.hibernate-orm.packages=com.github.warada_v2.shared.entities,com.github.warada_v2.shared.converter

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/migration/db-changelog-master.yaml

# Outgoing: chapter-pending
mp.messaging.outgoing.chapter-pending-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.chapter-pending-out.exchange.name=chapter.pending.exchange
mp.messaging.outgoing.chapter-pending-out.exchange.type=direct
mp.messaging.outgoing.chapter-pending-out.exchange.durable=true
mp.messaging.outgoing.chapter-pending-out.default-routing-key=pending
mp.messaging.outgoing.chapter-pending-out.content-type=application/json

# Incoming: comic-extracted
mp.messaging.incoming.comic-extracted-in.connector=smallrye-rabbitmq
mp.messaging.incoming.comic-extracted-in.exchange.name=comic.extracted.exchange
mp.messaging.incoming.comic-extracted-in.exchange.type=direct
mp.messaging.incoming.comic-extracted-in.queue.name=comic.extracted.queue
mp.messaging.incoming.comic-extracted-in.queue.durable=true
mp.messaging.incoming.comic-extracted-in.routing-keys=extracted
mp.messaging.incoming.comic-extracted-in.queue.routing-keys=extracted
mp.messaging.incoming.comic-extracted-in.content-type=application/json
mp.messaging.incoming.comic-extracted-in.failure-strategy=reject
mp.messaging.incoming.comic-extracted-in.auto-bind-dlq=true
mp.messaging.incoming.comic-extracted-in.dead-letter-queue-name=comic.extracted.queue.dlq
mp.messaging.incoming.comic-extracted-in.dead-letter-exchange=amq.direct
mp.messaging.incoming.comic-extracted-in.dead-letter-routing-key=comic.extracted.queue.dlq
mp.messaging.incoming.comic-extracted-in.concurrency=1

# Incoming: chapter-images-extracted
mp.messaging.incoming.chapter-images-extracted-in.connector=smallrye-rabbitmq
mp.messaging.incoming.chapter-images-extracted-in.exchange.name=chapter.images.extracted.exchange
mp.messaging.incoming.chapter-images-extracted-in.exchange.type=direct
mp.messaging.incoming.chapter-images-extracted-in.queue.name=chapter.images.extracted.queue
mp.messaging.incoming.chapter-images-extracted-in.queue.durable=true
mp.messaging.incoming.chapter-images-extracted-in.routing-keys=images-extracted
mp.messaging.incoming.chapter-images-extracted-in.queue.routing-keys=images-extracted
mp.messaging.incoming.chapter-images-extracted-in.content-type=application/json
mp.messaging.incoming.chapter-images-extracted-in.failure-strategy=reject
mp.messaging.incoming.chapter-images-extracted-in.auto-bind-dlq=true
mp.messaging.incoming.chapter-images-extracted-in.dead-letter-queue-name=chapter.images.extracted.queue.dlq
mp.messaging.incoming.chapter-images-extracted-in.dead-letter-exchange=amq.direct
mp.messaging.incoming.chapter-images-extracted-in.dead-letter-routing-key=chapter.images.extracted.queue.dlq
mp.messaging.incoming.chapter-images-extracted-in.concurrency=3

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DEV_DB_USERNAME:postgres}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/postgres}
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.otel.enabled=false
%dev.rabbitmq-host=${DEV_RABBITMQ_HOST:localhost}
%dev.rabbitmq-port=${DEV_RABBITMQ_PORT:5672}
%dev.rabbitmq-username=${DEV_RABBITMQ_USERNAME:guest}
%dev.rabbitmq-password=${DEV_RABBITMQ_PASSWORD:guest}

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.otel.enabled=true
%prod.quarkus.otel.exporter.otlp.endpoint=${OTLP_ENDPOINT}
%prod.rabbitmq-host=${RABBITMQ_HOST}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USERNAME}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD}

# Native build (activated via -Dquarkus.profile=prod)
%prod.quarkus.native.enabled=true
%prod.quarkus.native.container-build=true
%prod.quarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21
%prod.quarkus.package.jar.enabled=false
