quarkus:
  application:
    name: warada_v2
    version: 1.0.0
    group-id: com.github.warada_v2

  liquibase:
    migrate-at-start: true
    change-log: db/migration/db-changelog-master.yaml

  profile: dev

  datasource:
    db-kind: postgresql
    username: postgres
    password: postgres
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:4321/postgres}

  index-dependency:
    commons:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: commons
    configurations:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: configurations
    db-entities:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: db-entities
    repositories:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: repositories
    resources:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: resources
    services:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: services


  hibernate-orm:
    database:
      schema-management:
        strategy: update
    log:
      sql: true

  smallrye-graphql:
    ui:
      enabled: true                    # Enable GraphQL UI
      always-include: true
    schema-available: true           # Make schema available at /q/graphql/schema.graphql
    metrics:
      enabled: true
    tracing:
      enabled: true
    # Schema location
    schema-include-scalars: true
    schema-include-directives: true
    log-payload: queryAndVariables  # For debugging

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

"%dev":
  quarkus:
    profile: dev

"%prod":
  quarkus:
    profile: prod
