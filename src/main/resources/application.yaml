quarkus:
  arc:
    dev-mode:
      generate-dependency-graphs: true
      monitoring-enabled: true

  application:
    name: warada_v2
    version: 1.0.0
    group-id: com.github.warada_v2

  liquibase:
    migrate-at-start: true
    change-log: db/migration/db-changelog-master.yaml

  profile: dev
  datasource:
    db-kind: postgresql
    username: postgres
    password: postgres
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}

  index-dependency:
    commons:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: commons
    configurations:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: configurations
    db-entities:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: db-entities
    repositories:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: repositories
    resources:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: resources
    services:
      group-id: ${quarkus.application.group-id:com.github.warada_v2}
      artifact-id: services


  smallrye-graphql:
    ui:
      enabled: true                    # Enable GraphQL UI
      always-include: true
    schema-available: true           # Make schema available at /q/graphql/schema.graphql
    metrics:
      enabled: true
    tracing:
      enabled: true
    # Schema location
    schema-include-scalars: true
    schema-include-directives: true
    log-payload: queryAndVariables  # For debugging

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

"%dev":
  quarkus:

    native:
      enabled: true
      container-build: false

    log:
      level: INFO
      category:
        org.jboss.resteasy.reactive.client.logging:
          level: DEBUG


    hibernate-orm:
      log:
        sql: false

    smallrye-graphql:
      ui:
        enabled: true
        always-include: true
      schema-available: true
      metrics:
        enabled: true
      tracing:
        enabled: true
      # Schema location
      schema-include-scalars: true
      schema-include-directives: true
      log-payload: queryAndVariables  # For debugging

    otel:
      enabled: false

    liquibase:
      migrate-at-start: true
      change-log: db/migration/db-changelog-master.yaml

    rest-client:
      logging:
        scope: request-response
        body-limit: 1024
      nettruyen:
        url: https://nettruyenar.com

  minio:
    secure: ${MINIO_SECURE:false}
    access-key: ${MINIO_ACCESS_KEY:4Vzg7fHEbwupPWMfTbew}
    secret-key: ${MINIO_SECRET_KEY:FkK9N3OwUg6Gm8gokdKMvFSyfryvGtl47RzY46YL}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}

  warada:
    nettruyen:
      url: https://nettruyenar.com
    image-bucket: warada-images
    image-bucket-temp-path: temp
    image-bucket-images-path: images
    clean-up:
      enabled: true
      min-age-minutes: 5

"%prod":
  quarkus:

    package:
      jar:
        enabled: false
        type: fast-jar

    native:
      enabled: true
      sources-only: false
      container-build: true

    liquibase:
      migrate-at-start: true
      change-log: db/migration/db-changelog-master.yaml

    smallrye-graphql:
      ui:
        enabled: false
        always-include: false
      schema-available: true
      metrics:
        enabled: true
      tracing:
        enabled: true
      # Schema location
      schema-include-scalars: true
      schema-include-directives: true
      log-payload: off

    datasource:
      db-kind: postgresql
      username: postgres
      password: postgres
      jdbc:
        url: ${DB_URL:jdbc:postgresql://postge:5432/postgres}

    otel:
      enabled: true
      metrics:
        enabled: true
      logs:
        enabled: true
      traces:
        enabled: true
      exporter:
        otlp:
          endpoint: ${OTLP_ENDPOINT}

    log:
      level: INFO
    #    console:
    #      format: %d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n


  warada:
    nettruyen:
      url: https://www.nettruyenar.com
    image-bucket: warada-images
    image-bucket-temp-path: temp
    image-bucket-images-path: images
    clean-up:
      enabled: true
      min-age-minutes: 5

  minio:
    secure: ${MINIO_SECURE}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    endpoint: ${MINIO_ENDPOINT}

