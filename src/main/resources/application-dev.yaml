quarkus:
  config:
    profile:
      parent: default

  package:
    jar:
      enabled: true
      type: uber-jar

  native:
    enabled: false
    container-build: false

  log:
    level: INFO

  smallrye-graphql:
    ui:
      enabled: true
      always-include: true
    schema-available: true
    metrics:
      enabled: true
    tracing:
      enabled: true
    # Schema location
    schema-include-scalars: true
    schema-include-directives: true
    log-payload: queryAndVariables  # For debugging

  liquibase:
    migrate-at-start: true
    change-log: db/migration/db-changelog-master.yaml
