quarkus.console.color=false
quarkus.arc.dev-mode.generate-dependency-graphs=true
quarkus.arc.dev-mode.monitoring-enabled=true

quarkus.application.name=warada_v2
quarkus.application.version=1.0.0

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/migration/db-changelog-master.yaml

quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1024
quarkus.rest-client.nettruyen.url=https://nettruyenar.com

quarkus.index-dependency.commons.group-id=com.github.warada_v2
quarkus.index-dependency.commons.artifact-id=commons
quarkus.index-dependency.configurations.group-id=com.github.warada_v2
quarkus.index-dependency.configurations.artifact-id=configurations
quarkus.index-dependency.db-entities.group-id=com.github.warada_v2
quarkus.index-dependency.db-entities.artifact-id=db-entities
quarkus.index-dependency.repositories.group-id=com.github.warada_v2
quarkus.index-dependency.repositories.artifact-id=repositories
quarkus.index-dependency.resources.group-id=com.github.warada_v2
quarkus.index-dependency.resources.artifact-id=resources
quarkus.index-dependency.services.group-id=com.github.warada_v2
quarkus.index-dependency.services.artifact-id=services

quarkus.smallrye-graphql.ui.enabled=true
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.schema-available=true
quarkus.smallrye-graphql.metrics.enabled=false
quarkus.smallrye-graphql.tracing.enabled=false
quarkus.smallrye-graphql.schema-include-scalars=true
quarkus.smallrye-graphql.schema-include-directives=true
quarkus.smallrye-graphql.log-payload=queryAndVariables

mp.messaging.outgoing.chapter-crawl-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.chapter-crawl-out.exchange.name=chapter-crawl
mp.messaging.outgoing.chapter-crawl-out.exchange.type=direct
mp.messaging.outgoing.chapter-crawl-out.exchange.durable=true
mp.messaging.outgoing.chapter-crawl-out.default-routing-key=crawl
mp.messaging.outgoing.chapter-crawl-out.content-type=application/json

mp.messaging.incoming.chapter-crawl-in.connector=smallrye-rabbitmq
mp.messaging.incoming.chapter-crawl-in.exchange.name=chapter-crawl
mp.messaging.incoming.chapter-crawl-in.exchange.type=direct
mp.messaging.incoming.chapter-crawl-in.queue.name=chapter-crawl-queue
mp.messaging.incoming.chapter-crawl-in.queue.durable=true
mp.messaging.incoming.chapter-crawl-in.routing-keys=crawl
mp.messaging.incoming.chapter-crawl-in.queue.routing-keys=crawl
mp.messaging.incoming.chapter-crawl-in.content-type=application/json
mp.messaging.incoming.chapter-crawl-in.failure-strategy=reject
mp.messaging.incoming.chapter-crawl-in.auto-bind-dlq=true
mp.messaging.incoming.chapter-crawl-in.dead-letter-queue-name=chapter-crawl-queue.dlq
mp.messaging.incoming.chapter-crawl-in.dead-letter-exchange=chapter-crawl-dlx
mp.messaging.incoming.chapter-crawl-in.dead-letter-exchange-type=direct
mp.messaging.incoming.chapter-crawl-in.dead-letter-routing-key=chapter-crawl-queue.dlq
mp.messaging.incoming.chapter-crawl-in.dlx.declare=true
mp.messaging.incoming.chapter-crawl-in.concurrency=3

management.endpoints.web.exposure.include=health,metrics,prometheus

warada.nettruyen.url=https://nettruyenar.com
warada.image-bucket=warada-images
warada.image-bucket-temp-path=temp
warada.image-bucket-images-path=images
warada.clean-up.enabled=true
warada.clean-up.min-age-minutes=5

%dev.quarkus.native.enabled=true
%dev.quarkus.native.container-build=false
%dev.quarkus.log.level=INFO
%dev.quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=INFO

# Preferred local development flow: devcontainer + Docker Compose.
# These DEV_* values work both on the host machine and inside the devcontainer.
# - host machine defaults use localhost
# - devcontainer overrides use compose service names
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DEV_DB_USERNAME:postgres}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/postgres}
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true
%dev.quarkus.otel.enabled=false
%dev.rabbitmq-host=${DEV_RABBITMQ_HOST:localhost}
%dev.rabbitmq-port=${DEV_RABBITMQ_PORT:5672}
%dev.rabbitmq-username=${DEV_RABBITMQ_USERNAME:guest}
%dev.rabbitmq-password=${DEV_RABBITMQ_PASSWORD:guest}
%dev.quarkus.minio.host=${DEV_MINIO_HOST:localhost}
%dev.quarkus.minio.port=${DEV_MINIO_PORT:9000}
%dev.quarkus.minio.access-key=${DEV_MINIO_ACCESS_KEY:admin}
%dev.quarkus.minio.secret-key=${DEV_MINIO_SECRET_KEY:admin123123123123}
%dev.quarkus.minio.secure=${DEV_MINIO_SECURE:false}

