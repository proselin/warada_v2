quarkus.application.name=warada-crawl
quarkus.http.port=8081
quarkus.http.host=0.0.0.0

# Outgoing: comic-extracted
mp.messaging.outgoing.comic-extracted-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.comic-extracted-out.exchange.name=comic.extracted.exchange
mp.messaging.outgoing.comic-extracted-out.exchange.type=direct
mp.messaging.outgoing.comic-extracted-out.exchange.durable=true
mp.messaging.outgoing.comic-extracted-out.default-routing-key=extracted
mp.messaging.outgoing.comic-extracted-out.content-type=application/json

# Outgoing: chapter-images-extracted
mp.messaging.outgoing.chapter-images-extracted-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.chapter-images-extracted-out.exchange.name=chapter.images.extracted.exchange
mp.messaging.outgoing.chapter-images-extracted-out.exchange.type=direct
mp.messaging.outgoing.chapter-images-extracted-out.exchange.durable=true
mp.messaging.outgoing.chapter-images-extracted-out.default-routing-key=images-extracted
mp.messaging.outgoing.chapter-images-extracted-out.content-type=application/json

# Incoming: chapter-pending
mp.messaging.incoming.chapter-pending-in.connector=smallrye-rabbitmq
mp.messaging.incoming.chapter-pending-in.exchange.name=chapter.pending.exchange
mp.messaging.incoming.chapter-pending-in.exchange.type=direct
mp.messaging.incoming.chapter-pending-in.queue.name=chapter.pending.queue
mp.messaging.incoming.chapter-pending-in.queue.durable=true
mp.messaging.incoming.chapter-pending-in.routing-keys=pending
mp.messaging.incoming.chapter-pending-in.queue.routing-keys=pending
mp.messaging.incoming.chapter-pending-in.content-type=application/json
mp.messaging.incoming.chapter-pending-in.failure-strategy=reject
mp.messaging.incoming.chapter-pending-in.auto-bind-dlq=true
mp.messaging.incoming.chapter-pending-in.dead-letter-queue-name=chapter.pending.queue.dlq
mp.messaging.incoming.chapter-pending-in.concurrency=3

warada.nettruyen.url=https://nettruyenar.com
warada.image-bucket=warada-images
warada.image-bucket-temp-path=temp
warada.image-bucket-images-path=images
warada.clean-up.enabled=true
warada.clean-up.min-age-minutes=5

%dev.quarkus.rest-client.nettruyen.url=https://nettruyenar.com
%dev.quarkus.rest-client.core-service.url=${CORE_SERVICE_URL:http://localhost:8082}
%dev.quarkus.otel.enabled=false
%dev.rabbitmq-host=${DEV_RABBITMQ_HOST:localhost}
%dev.rabbitmq-port=${DEV_RABBITMQ_PORT:5672}
%dev.rabbitmq-username=${DEV_RABBITMQ_USERNAME:guest}
%dev.rabbitmq-password=${DEV_RABBITMQ_PASSWORD:guest}
%dev.quarkus.minio.host=${DEV_MINIO_HOST:localhost}
%dev.quarkus.minio.port=${DEV_MINIO_PORT:9000}
%dev.quarkus.minio.access-key=${DEV_MINIO_ACCESS_KEY:admin}
%dev.quarkus.minio.secret-key=${DEV_MINIO_SECRET_KEY:admin123123123123}
%dev.quarkus.minio.secure=${DEV_MINIO_SECURE:false}

%prod.quarkus.rest-client.nettruyen.url=https://www.nettruyenar.com
%prod.quarkus.rest-client.core-service.url=${CORE_SERVICE_URL}
%prod.quarkus.otel.enabled=true
%prod.quarkus.otel.exporter.otlp.endpoint=${OTLP_ENDPOINT}
%prod.rabbitmq-host=${RABBITMQ_HOST}
%prod.rabbitmq-port=${RABBITMQ_PORT:5672}
%prod.rabbitmq-username=${RABBITMQ_USERNAME}
%prod.rabbitmq-password=${RABBITMQ_PASSWORD}
%prod.quarkus.minio.host=${MINIO_ENDPOINT}
%prod.quarkus.minio.access-key=${MINIO_ACCESS_KEY}
%prod.quarkus.minio.secret-key=${MINIO_SECRET_KEY}
%prod.quarkus.minio.secure=${MINIO_SECURE}
%prod.warada.nettruyen.url=https://www.nettruyenar.com
