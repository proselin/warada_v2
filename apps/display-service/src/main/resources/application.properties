quarkus.application.name=warada-display
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

quarkus.hibernate-orm.packages=com.github.warada_v2.shared.entities,com.github.warada_v2.shared.converter
# display-service never migrates — core-service owns migrations
# Liquibase is managed by core-service only; do not add quarkus-liquibase extension here

quarkus.smallrye-graphql.ui.enabled=true
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.schema-available=true
quarkus.smallrye-graphql.log-payload=queryAndVariables

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=${DEV_DB_USERNAME:postgres}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/postgres}
%dev.quarkus.hibernate-orm.log.sql=false
%dev.quarkus.otel.enabled=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DISPLAY_DB_USERNAME:${DB_USERNAME}}
%prod.quarkus.datasource.password=${DISPLAY_DB_PASSWORD:${DB_PASSWORD}}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.smallrye-graphql.ui.enabled=false
%prod.quarkus.smallrye-graphql.ui.always-include=false
%prod.quarkus.smallrye-graphql.log-payload=off
%prod.quarkus.otel.enabled=true
%prod.quarkus.otel.exporter.otlp.endpoint=${OTLP_ENDPOINT}
