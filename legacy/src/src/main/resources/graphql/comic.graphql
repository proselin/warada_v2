type Comic {
    id: ID!
    updatedAt: String!
    createdAt:  String!
    title: String!
    chapterCount: Int!
    originId: Int!
    status: String
    description: String
    originUrl: String
    tags: [Tag]
    author: String
    slug: String
    crawlingStatus: String
    thumbImage: Image
    chapters: [Chapter]
}

extend type Query {
    chapters: [Chapter]
}

extend type Mutation {

}