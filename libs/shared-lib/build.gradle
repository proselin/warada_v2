plugins {
    id 'java-library'
}

group = 'com.github.warada_v2'
version = '1.0.0'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    api enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    api 'io.quarkus:quarkus-hibernate-orm-panache'
    api 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    api 'io.quarkus:quarkus-rest-jackson'
    api 'io.quarkus.platform:quarkus-bom:3.28.1'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}
