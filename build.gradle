plugins {
    id 'java'
    id 'jacoco'
    id 'io.quarkus'
}

group = 'com.github.warada_v2'
version = '1.0.0'


repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
}

configurations.configureEach {
    resolutionStrategy {
        force "com.github.docker-java:docker-java-api:${dockerJavaVersion}"
        force "com.github.docker-java:docker-java-core:${dockerJavaVersion}"
        force "com.github.docker-java:docker-java-transport:${dockerJavaVersion}"
        force "com.github.docker-java:docker-java-transport-zerodep:${dockerJavaVersion}"
    }
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    /**
     * Reactive
     */
//    implementation 'io.quarkus:quarkus-hibernate-reactive-panache'
//    implementation 'io.quarkus:quarkus-reactive-pg-client'
//    implementation 'io.quarkus:quarkus-reactive-routes'

    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-smallrye-graphql-client'
    implementation 'io.quarkus:quarkus-smallrye-graphql'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation "io.quarkus:quarkus-opentelemetry"
    implementation 'io.quarkus:quarkus-rest-client'
    implementation 'io.quarkus:quarkus-rest-client-jackson'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-messaging-rabbitmq'

    implementation 'io.quarkiverse.minio:quarkus-minio:3.8.6'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.quarkus:quarkus-jacoco'
}


java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def dockerApiVersion = (findProperty('systemProp.api.version') ?: '1.44').toString()
def dockerEnv = [
        'DOCKER_HOST': System.getenv('DOCKER_HOST') ?: 'unix:///var/run/docker.sock',
        'DOCKER_API_VERSION': System.getenv('DOCKER_API_VERSION') ?: dockerApiVersion,
        'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE': System.getenv('TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE') ?: '/var/run/docker.sock'
]
def javaModuleOpens = ['--add-opens=java.base/java.lang=ALL-UNNAMED']

quarkusDev {
    environmentVariables = dockerEnv
    jvmArgs = javaModuleOpens
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    systemProperty "api.version", dockerApiVersion
    jvmArgs = javaModuleOpens
    dockerEnv.each { key, value ->
        environment key, value
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

tasks.register("buildProdNative") {
    group = "build"
    description = "Build Quarkus native image for PROD"

    dependsOn("clean", "build")

    doFirst {
        System.setProperty("quarkus.profile", "prod")
        System.setProperty("quarkus.package.type", "native")
        System.setProperty("quarkus.native.container-build", "true")

    }
}
